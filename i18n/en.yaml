flows.lede: "Besides money flows, the diagram shows data flows, savings and regulatory constraints, because the value of credential ecosystems often arises as savings rather than as direct payments. Choose a model. The label <span class=\"tag st-havainnollistava\">illustrative</span> means a possible, not a verified, money flow."
