map.lede: "The basic setting of digital credentials is always the same: an <strong>issuer</strong> issues a credential to a <strong>holder</strong>, who presents it to a <strong>verifier</strong>. eIDAS regulation and the business wallet proposal add roles, obligations and trust infrastructure to this. Switch layers on and off, and select a role to see its connections. The same organisation often acts in several roles."
map.layersAria: Layers
map.highlight: Highlight a use case
map.noHighlight: no highlight
map.legend.perus: Basic roles in every credential ecosystem
map.legend.eudi: Added by the eIDAS Regulation and the EUDI Wallet
map.legend.ebw: Added by the business wallet proposal
map.legend.findy: The Findynet network
