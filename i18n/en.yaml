panel.emptyTitle: Select a role
panel.emptyText: Click a role on the map to see its tasks, obligations and connections to other roles.
panel.layersTitle: The idea of the layers
panel.layer.perus: <b>Basic roles</b> are the same in every credential ecosystem, regardless of regulation.
panel.layer.eudi: <b>eIDAS and the EUDI Wallet</b> bring qualified attestations, certification, registration and trusted lists.
panel.layer.ebw: <b>The business wallet</b> brings organisations’ wallets, company identifiers and an official communication channel.
panel.layer.findy: <b>Findynet</b> complements the trust infrastructure with ecosystem-specific rules and a trust registry.
panel.tip: Tip – choose “Highlight a use case” to see who acts in which role, for example in the Kela–HSL discount entitlement or in public procurement.
panel.obligations: Tasks and obligations
panel.examples: Examples
panel.isThisYou: Is this your role?
panel.connections: Connections
panel.basis: Legal basis and sources.
panel.clear: Clear selection

uc.lede: "Use cases differ in what drives them: some are mandated by their own sector legislation, some are merely enabled by regulation, and some arise from the parties’ own needs. Select a use case to see the roles, the flow and the value. From each use case you can also go to its money flows and trust chain."
