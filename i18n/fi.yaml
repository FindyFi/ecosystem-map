panel.layer.perus: <b>Perusroolit</b> ovat samat kaikissa todiste-ekosysteemeissä sääntelystä riippumatta.
panel.layer.eudi: <b>eIDAS ja EUDI-lompakko</b> tuovat hyväksytyt todisteet, sertifioinnin, rekisteröinnin ja luotettavat listat.
panel.layer.ebw: <b>Yrityslompakko</b> tuo organisaatioiden lompakot, yritystunnisteet ja virallisen viestintäkanavan.
panel.layer.findy: <b>Findynet</b> täydentää luottamusinfraa ekosysteemikohtaisilla säännöillä ja luottamusrekisterillä.
panel.tip: Vinkki – valitse ”Korosta käyttötapaus” nähdäksesi, kuka toimii missäkin roolissa esimerkiksi Kela–HSL-alennusoikeudessa tai julkisessa hankinnassa.
