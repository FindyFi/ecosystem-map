flows.lede: "Rahavirtojen lisäksi kaaviossa näkyvät tietovirrat, säästöt ja sääntelyn reunaehdot, koska todiste-ekosysteemien arvo syntyy usein säästöinä eikä suorina maksuina. Valitse tarkasteltava malli. Merkintä <span class=\"tag st-havainnollistava\">havainnollistava</span> tarkoittaa mahdollista, ei todennettua rahavirtaa."
