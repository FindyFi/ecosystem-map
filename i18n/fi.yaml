map.lede: "Digitaalisten todisteiden perusasetelma on aina sama: <strong>myöntäjä</strong> antaa todisteen <strong>haltijalle</strong>, joka esittää sen <strong>todentajalle</strong>. eIDAS-sääntely ja yrityslompakkoehdotus lisäävät tähän rooleja, velvoitteita ja luottamusinfraa. Kytke kerroksia päälle ja pois, ja valitse rooli nähdäksesi sen yhteydet. Sama organisaatio toimii usein monessa roolissa."
