trust.lede: Luottamusinfran eri osat vastaavat eri kysymyksiin. EUDI-infra varmistaa, että osapuolet ovat rekisteröityjä ja eurooppalaisia ja että lompakko on sertifioitu. Ekosysteemikohtainen luottamusrekisteri ja sääntökirja kertovat, kuka on valtuutettu myöntämään mitäkin ja millä vastuilla.
