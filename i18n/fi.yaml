uc.lede: "Käyttötapaukset eroavat siinä, mikä niitä ajaa eteenpäin: osaa velvoittaa oma sektorilainsäädäntö, osaa sääntely vain mahdollistaa, ja osa syntyy toimijoiden omasta tarpeesta. Valitse käyttötapaus nähdäksesi roolit, kulun ja arvon. Jokaisesta käyttötapauksesta pääset myös sen rahavirtoihin ja luottamusketjuun."
