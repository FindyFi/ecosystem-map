      name:
        fi: Digitaalinen sairaanhoitokortti
        en: Digital health insurance card
      description:
        fi: Vakuuttava laitos myöntää kortin lompakkoon. DC4EU-pilotissa todiste on SD-JWT VC -muodossa.
        en: The insuring institution issues the card to the wallet. In the DC4EU pilot, the credential is in SD-JWT VC format.
    - from: haltija
      to: hoitaja
      type: data
      status: kaytanto
      name:
        fi: Kortin ja tunnistetietojen esittäminen
        en: Presenting the card and identification data
      description:
        fi: Haltija skannaa vastaanoton QR-koodin ja jakaa sairaanhoitokortin ja henkilön tunnistetiedot suostumuksellaan.
        en: The holder scans the QR code at reception and shares the health insurance card and the person identification data with their consent.
    - from: hoitaja
      to: tl
      type: data
      status: voimassa
      name:
        fi: "Tarkistus: onko myöntäjä luotettu"
        en: "Check: is the issuer trusted"
      description:
        fi: Palveluntarjoaja tarkistaa, että kortin allekirjoittaja on luotettavilla listoilla.
        en: The provider checks that the card’s signer is on the trusted lists.
    - from: hoitaja
      to: hoitomaa
      type: data
      status: voimassa
      name:
        fi: Korvaustiedot
        en: Reimbursement data
      description:
        fi: Palveluntarjoaja välittää korvaustiedot sosiaaliturvalaitoksille. Digitaalinen kortti korvaa paperikopion.
        en: The provider passes the reimbursement data to the social security institutions. The digital card replaces the paper copy.
    - from: hoitaja
      to: hoitaja
      type: saasto
      status: kaytanto
      name:
        fi: Tarkistus ilman käsityötä
        en: Checking without manual work
      pill:
        fi: "Säästö: ei käsin tarkistusta"
        en: "Saving: no manual checks"
      description:
        fi: Kortin voimassaolo ja vakuutusturva tarkistetaan heti, eikä kopiota tarvitse ottaa tai selvitellä jälkikäteen.
        en: The card’s validity and coverage are checked immediately, and no copy needs to be taken or followed up afterwards.
    - from: vakuuttava
      to: vakuuttava
      type: saasto
      status: lahde
      name:
        fi: Väärinkäytökset vähenevät
        en: Less misuse
      pill:
        fi: "Hyöty: peruutus reaaliajassa"
        en: "Benefit: real-time revocation"
      description:
        fi: Ohjekirjan mukaan tarkistettavat todisteet ja reaaliaikainen peruutus vähentävät väärinkäytöksiä. Korttiin perustuvia korvausvaatimuksia tehdään noin 2,2 miljoonaa vuodessa.
        en: According to the manual, verifiable credentials and real-time revocation reduce misuse. Around 2.2 million reimbursement claims based on the card are made every year.
    - from: haltija
      to: haltija
      type: saasto
      status: kaytanto
      pill_position: below
      name:
        fi: Kortti aina mukana
        en: The card is always at hand
      pill:
        fi: "Hyöty: vähemmän paperia"
        en: "Benefit: less paper"
      description:
        fi: Kortti on puhelimessa, eikä muovikorttia tai väliaikaista todistusta tarvitse kuljettaa mukana.
        en: The card is on the phone, and there is no need to carry the plastic card or a provisional certificate.
    - from: hoitomaa
      to: hoitaja
      type: raha
      status: voimassa
      bend: 40
      name:
        fi: Hoidon korvaus
        en: Payment for care
      description:
        fi: Olemassa oleva rahavirta. Hoitomaan järjestelmä korvaa hoidon samoin ehdoin kuin paikalliselle asukkaalle.
        en: An existing money flow. The host country’s system covers the care under the same conditions as for a local resident.
    - from: vakuuttava
      to: hoitomaa
      type: raha
      status: voimassa
      bend: 60
      name:
        fi: Kulujen korvaus maiden välillä
        en: Reimbursement between countries
      description:
        fi: Vakuuttavan maan yhteyslaitos korvaa kulut hoitomaan hinnoin. Lompakko ei muuta tätä rahavirtaa.
        en: The liaison body of the insuring country reimburses the costs at the host country’s rates. The wallet does not change this money flow.
    - from: vakuuttava
      to: vakuuttava
      type: reuna
      status: voimassa
      pill_position: below
      name:
        fi: Lompakkoon myöntäminen vapaaehtoista
        en: Issuing to the wallet is voluntary
      pill:
        fi: "Ei velvoitetta eikä kieltoa"
        en: "Neither mandated nor prohibited"
      description:
        fi: Unionin oikeus ei velvoita eikä kiellä myöntämästä korttia EUDI-lompakkoon. Suunniteltu ESSPASS-ehdotus voi muuttaa tilanteen.
        en: Union law neither mandates nor prohibits issuing the card to the EUDI Wallet. The planned ESSPASS proposal may change this.
    - from: haltija
      to: lompakko
      type: reuna
      status: voimassa
      name:
        fi: Lompakko maksuton haltijalle
        en: Wallet free of charge for the holder
      description:
        fi: EUDI-lompakko on luonnollisille henkilöille maksuton.
        en: The EUDI Wallet is free of charge for natural persons.
  extra:
    title:
      fi: Mitä tästä voi oppia
      en: What can be learned
    text:
      fi: Kun käyttötapauksella ei ole omaa velvoitetta, käyttöönotto riippuu siitä, säästävätkö myöntäjä ja todentajat vaivaa. Sairaanhoitokortti hyödyntää eIDAS-luottamusinfraa sellaisenaan, mutta todistetyypistä, peruutuksesta ja korvaustietojen kulusta on sovittava yhteisesti. Saman myöntäjän muut todisteet, kuten Kela–HSL-käyttötapauksen eläkeläisstatus, voivat käyttää samoja sopimuksia.
      en: When a use case has no obligation of its own, adoption depends on whether the issuer and the verifiers save effort. The health insurance card uses the eIDAS trust infrastructure as it is, but the credential type, revocation and the flow of reimbursement data must be agreed jointly. Other credentials from the same issuer, such as the pensioner status in the Kela–HSL use case, can use the same agreements.
