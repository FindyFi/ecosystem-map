    - from: kauppias
      to: kauppias
      type: saasto
      status: havainnollistava
      name:
        fi: Ikätarkistus maksun yhteydessä
        en: Age check with the payment
      pill:
        fi: "Säästö: ei erillistä ikätarkistusta"
        en: "Saving: no separate age check"
      description:
        fi: Ikärajoitettujen tuotteiden myynnissä ikä tarkistetaan luotettavasti samassa vaiheessa kuin maksu.
        en: When selling age-restricted products, age is checked reliably in the same step as the payment.
    - from: maksaja
      to: kauppias
      type: raha
      status: kaytanto
      bend: 60
      name:
        fi: Ostoksen hinta
        en: Purchase price
      description:
        fi: Olemassa oleva rahavirta; lompakko muuttaa vain sen, miten maksu vahvistetaan.
        en: An existing money flow; the wallet only changes how the payment is authenticated.
    - from: kauppias
      to: infra
      type: raha
      status: kaytanto
      name:
        fi: Maksunvälityksen palkkiot
        en: Payment processing fees
      description:
        fi: Olemassa olevat palkkiot korttimaksuista ja tilisiirroista säilyvät ennallaan.
        en: Existing fees for card payments and credit transfers remain unchanged.
    - from: pankki
      to: lompakko
      type: raha
      model: C
      status: havainnollistava
      name:
        fi: Lompakkointegraatio
        en: Wallet integration
      description:
        fi: Pankki voi hankkia integraation tai välityspalvelun lompakon hyväksymiseen. Ehdotukset eivät määrää hintoja.
        en: The bank can procure an integration or intermediary service for accepting the wallet. No prices are set.
    - from: pankki
      to: pankki
      type: reuna
      status: voimassa
      name:
        fi: Lompakko on hyväksyttävä
        en: The wallet must be accepted
      pill:
        fi: "Velvoite: hyväksy EUDI-lompakko"
        en: "Obligation: accept the EUDI Wallet"
      description:
        fi: Maksupalveluntarjoajan on hyväksyttävä EUDI-lompakko vahvaan tunnistamiseen käyttäjän pyynnöstä, ohjekirjan mukaan viimeistään vuoden 2027 lopussa.
        en: The payment service provider must accept the EUDI Wallet for strong customer authentication at the user’s request, according to the manual by the end of 2027 at the latest.
    - from: maksaja
      to: lompakko
      type: reuna
      status: voimassa
      name:
        fi: Lompakko maksuton maksajalle
        en: Wallet free of charge for the payer
      description:
        fi: EUDI-lompakko on luonnollisille henkilöille maksuton, ja lompakon tarjoaja ei saa seurata, missä lompakkoa käytetään.
        en: The EUDI Wallet is free of charge for natural persons, and the wallet provider may not track where the wallet is used.
  extra:
    title:
      fi: Mitä tästä voi oppia
      en: What can be learned
    text:
      fi: Kun lompakko asettuu olemassa olevan maksuinfran päälle, rahavirrat pysyvät ennallaan, ja arvo syntyy siitä, että tunnistaminen ja muiden tietojen todistaminen yhdistyvät yhteen vaiheeseen. Velvoite hyväksyä lompakko luo pankeille syyn integroitua, mutta maksajat ottavat lompakon käyttöön vain, jos se on yhtä sujuva kuin pankin oma sovellus.
      en: When the wallet sits on top of the existing payment infrastructure, money flows stay unchanged, and value arises from combining authentication and proving other data into a single step. The obligation to accept the wallet gives banks a reason to integrate, but payers will only adopt the wallet if it is as smooth as the bank’s own app.
