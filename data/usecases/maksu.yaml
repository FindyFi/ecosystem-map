    en: Payment authentication with the wallet
  intro:
    fi: "Rahavirrat ovat pääosin olemassa olevia: maksaja maksaa ostoksensa, ja kauppias maksaa maksunvälityksen palkkiot. Uusi arvo syntyy mahdollisina säästöinä tunnistamisessa ja ikätarkistuksessa. Lompakko on maksajalle maksuton, ja havainnoimattomuusvaatimus rajoittaa maksukohtaista laskutusta. Kuvaus on yleistetty malli."
    en: "Money flows are mainly existing ones: the payer pays for the purchase and the merchant pays the payment processing fees. New value arises as potential savings in authentication and age checks. The wallet is free of charge for the payer, and the unobservability requirement limits per-transaction charging. The description is a generalised model."
