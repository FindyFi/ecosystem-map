      status: havainnollistava
      name:
        fi: Tunnistusratkaisujen ylläpito kevenee
        en: Lighter upkeep of authentication solutions
      pill:
        fi: "Säästö: vähemmän omaa tunnistusta"
        en: "Saving: less own authentication"
      description:
        fi: Ohjekirjan mukaan sertifioitu lompakko voi alentaa toimintakuluja, helpottaa auditointia ja pienentää petosriskiä.
