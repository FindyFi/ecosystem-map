# Käyttötapaus. Kaikki näkymät (kuvaus, roolit kartalla, rahavirrat, luottamusketju) rakentuvat tästä tiedostosta.
id: kela
name:
  fi: Eläkeläisalennus joukkoliikenteessä
  en: Pensioner discount in public transport
org:
  fi: Kela–HSL
  en: Kela–HSL
short:
  fi: Kela myöntää eläkeläisstatuksen todisteen, HSL tarkistaa alennusoikeuden.
  en: Kela issues a credential of pensioner status, HSL checks the discount entitlement.
wallets:
  - any
  - eudi
driver: tarve
status: kaytanto
detail:
  title:
    fi: Eläkeläisalennus joukkoliikenteessä
    en: Pensioner discount in public transport
  highlight_label:
    fi: Kela–HSL – eläkeläisalennus
    en: Kela–HSL – pensioner discount
  lead:
    fi: Kela ja Helsingin seudun liikenne (HSL) digitalisoivat eläkeläisalennuksen yhdessä Findynetin kanssa.
    en: Kela, the Social Insurance Institution of Finland, and Helsinki Region Transport (HSL) are digitalising the pensioner discount together with Findynet.
  status: kaytanto
  intro:
    - fi: "Nykyisin Kela antaa todistuksen eläkkeestä kirjeenä, jonka laatii virkailija, ja HSL tarkistaa alennusoikeuden käsin. Prosessi on kallis ja manuaalinen molemmille, ja moni eläkeläinen odottaa digitaalista vaihtoehtoa. Perinteiset ratkaisut, kuten suora tiedonsiirto Kelalta HSL:lle, eivät olleet tietosuojalainsäädännön kannalta mahdollisia. Digitaalinen todiste ratkaisee tämän: tieto kulkee eläkeläisen kautta, ja hän päättää sen jakamisesta."
      en: "Today Kela provides a certificate of pension as a letter drafted by an official, and HSL checks the discount entitlement by hand. The process is costly and manual for both, and many pensioners are waiting for a digital alternative. Traditional solutions, such as a direct data transfer from Kela to HSL, were not possible under data protection legislation. A digital credential solves this: the data travels through the pensioner, who decides whether to share it."
  cast:
    lahde:
      fi: Kela – eläke- ja etuustiedot
      en: Kela – pension and benefit data
    myontaja:
      fi: Kela
      en: Kela
    pubeaa:
      fi: Kela (eIDAS-kehyksessä)
      en: Kela (in the eIDAS framework)
    haltija:
