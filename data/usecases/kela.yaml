        en: Participants in the Findynet network pay a participation fee that funds the trust registry, the network rules and interoperability work.
    - from: hsl
      to: findynet
      type: raha
      model: D
      status: kaytanto
      bend: -40
      name:
        fi: Verkoston osallistumismaksu
        en: Network participation fee
      description:
        fi: Sama osallistumismaksu todentajan puolelta.
        en: The same participation fee on the verifier side.
    - from: kela
      to: kelasw
      type: raha
      model: C
      status: kaytanto
      name:
        fi: Myöntöratkaisun hankinta
        en: Procuring the issuance solution
      description:
        fi: Kela valitsi myöntöratkaisunsa itsenäisesti. Yhteentoimivuuden ansiosta ohjelmiston voi vaihtaa.
        en: Kela chose its issuance solution independently. Thanks to interoperability, the software can be replaced.
    - from: hsl
      to: hslsw
      type: raha
      model: C
      status: kaytanto
      name:
        fi: Todennusratkaisun hankinta
        en: Procuring the verification solution
      description:
        fi: HSL valitsi todennusratkaisunsa itsenäisesti. Yhteentoimivuuden ansiosta ohjelmiston voi vaihtaa.
        en: HSL chose its verification solution independently. Thanks to interoperability, the software can be replaced.
    - from: kela
      to: hsl
      type: reuna
      status: kaytanto
      name:
        fi: Ei suoraa tiedonsiirtoa
        en: No direct data transfer
      description:
        fi: Tietosuojan vuoksi Kela ei luovuta tietoja HSL:lle, eikä se saa tietoa todisteen käytöstä.
        en: For data protection reasons, Kela does not disclose data to HSL, nor does it learn about the use of the credential.
    - from: elakelainen
      to: lompakko
      type: reuna
      status: voimassa
      name:
        fi: Lompakko maksuton haltijalle
        en: Wallet free of charge for the holder
      description:
        fi: EUDI-lompakko on luonnollisille henkilöille maksuton; muissa lompakoissa ehdot riippuvat tarjoajasta.
        en: The EUDI Wallet is free of charge for natural persons; for other wallets the terms depend on the provider.
  extra:
    title:
      fi: Mitä tästä voi oppia
      en: What can be learned
    text:
      fi: Kun arvo syntyy säästöinä molemmissa päissä, osapuolten ei tarvitse maksaa toisilleen. Yhteiset kulut – luottamusrekisteri, säännöt ja yhteentoimivuus – kannattaa jakaa ekosysteemin kesken, jolloin seuraavan todentajan, kuten museon tai uimahallin, liittyminen on halpaa.
      en: When value arises as savings at both ends, the parties do not need to pay each other. Shared costs – the trust registry, the rules and interoperability – are best split across the ecosystem, which makes it cheap for the next verifier, such as a museum or a swimming hall, to join.
