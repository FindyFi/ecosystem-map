      en: HSL
    ohjelmisto:
      fi: Kelan ja HSL:n itse valitsemat ratkaisut
      en: Solutions chosen by Kela and HSL themselves
    ekosysteemi:
      fi: Alennusoikeusekosysteemi
      en: Discount entitlement ecosystem
    luottekos:
      fi: Alennusoikeusekosysteemi
      en: Discount entitlement ecosystem
    rekisteri:
      fi: Findynetin luottamusrekisteri
      en: Findynet trust registry
    findynet:
