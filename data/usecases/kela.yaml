  steps:
    - fi: Eläkeläinen pyytää Kelalta todisteen eläkeläisstatuksestaan ja tunnistautuu.
      en: The pensioner requests a credential of their pensioner status from Kela and authenticates.
    - fi: Kela myöntää todisteen automaattisesti eläkeläisen lompakkoon. Virkailijan ei tarvitse laatia kirjettä.
      en: Kela issues the credential automatically to the pensioner’s wallet. No official needs to draft a letter.
    - fi: Eläkeläinen ostaa alennuslippua HSL:n verkkokaupassa, ja HSL pyytää todistetta alennusoikeudesta. Jatkossa sama toimii mobiilisovelluksessa ja mahdollisesti myös asiakaspalvelupisteessä.
      en: The pensioner buys a discounted ticket in HSL’s online shop, and HSL requests the credential of discount entitlement. Later the same will work in the mobile app and possibly also at customer service points.
    - fi: Lompakko tarkistaa, että pyytäjä on HSL ja että HSL on ekosysteemin jäsen.
      en: The wallet checks that the requester is HSL and that HSL is a member of the ecosystem.
    - fi: HSL tarkistaa todisteen allekirjoituksen ja sen, että Kela on valtuutettu myöntäjä.
      en: HSL checks the credential’s signature and that Kela is an authorised issuer.
    - fi: Alennus myönnetään. Kela ei saa tietoa siitä, missä todistetta käytettiin.
      en: The discount is granted. Kela does not learn where the credential was used.
  value:
    - who:
        fi: Eläkeläinen
        en: Pensioner
      text:
        fi: Digitaalinen vaihtoehto ilman kirjeen odottamista; jakaa vain alennusoikeuden, ei muita eläketietoja.
        en: A digital alternative without waiting for a letter; shares only the discount entitlement, no other pension data.
    - who:
        fi: Kela
        en: Kela
      text:
        fi: Virkailijan laatimia eläketodistuskirjeitä tarvitaan vähemmän, ja todiste myönnetään automaattisesti.
        en: Fewer certificate letters drafted by officials are needed, and the credential is issued automatically.
    - who:
        fi: HSL
        en: HSL
      text:
        fi: Alennusoikeuden tarkistus automatisoituu verkkokaupassa ja jatkossa muissa kanavissa.
        en: Checking the discount entitlement is automated in the online shop and later in other channels.
    - who:
        fi: Yhteiskunta
        en: Society
      text:
        fi: Malli on toistettavissa muihin alennusoikeuksiin, kuten opiskelija- ja vammaisalennuksiin, ja muille todentajille, kuten museoille ja uimahalleille.
        en: The model can be repeated for other discount entitlements, such as student and disability discounts, and for other verifiers, such as museums and swimming halls.
  sections:
    - title:
        fi: Toimittajariippumattomuus
        en: Vendor independence
      text:
        fi: Kela ja HSL valitsivat ohjelmistonsa toisistaan riippumatta. Pilotissa sama ohjelmistoratkaisu kattaa myöntämisen, lompakon ja todennuksen, mutta tuotannossa asiakas voi käyttää mitä tahansa yhteentoimivaa lompakkoa, ja Kela tai HSL voi vaihtaa ohjelmistoaan milloin tahansa. Tämä on mahdollista, koska kaikki osapuolet noudattavat samaa yhteentoimivuusprofiilia.
        en: Kela and HSL chose their software independently of each other. In the pilot, the same software solution covers issuance, the wallet and verification, but in production the customer can use any interoperable wallet, and Kela or HSL can switch software at any time. This is possible because all parties follow the same interoperability profile.
    - title:
        fi: Sääntely ja luottamus
        en: Regulation and trust
      text:
        fi: Käyttötapaukselle ei ole omaa EU-velvoitetta, vaan sen ajurina on osapuolten tarve. Toteutus ei edellytä EUDI-lompakkoa. Kun EUDI-lompakot tulevat käyttöön, Kela voisi myöntää saman todisteen myös niihin, jolloin HSL rekisteröityy luottavaksi osapuoleksi. Todisteen myöntäjän valtuutus ja osapuolten vastuut sovitaan alennusoikeusekosysteemissä, ja ne näkyvät luottamusrekisterissä.
        en: There is no EU obligation behind this use case; it is driven by the parties’ needs. The implementation does not require the EUDI Wallet. When EUDI Wallets become available, Kela could issue the same credential to them too, in which case HSL registers as a relying party. The issuer’s authorisation and the parties’ responsibilities are agreed in the discount entitlement ecosystem and shown in the trust registry.
  expert:
    fi: eIDAS-kehyksessä Kela on autenttisesta lähteestä vastaava julkinen elin, joten sen todisteet voisivat olla PuB-EAA-todisteita (art. 3(46), 45f). Sama ekosysteemi voi laajentua eurooppalaiseen vammaiskorttiin (direktiivi 2024/2841), jonka digitaalinen versio on tulossa EUDI-lompakkoon.
    en: In the eIDAS framework, Kela is a public body responsible for an authentic source, so its credentials could be PuB-EAAs (Art. 3(46), 45f). The same ecosystem can extend to the European Disability Card (Directive 2024/2841), whose digital version is coming to the EUDI Wallet.
  note:
    fi: Kuvaus on yleistetty eikä kerro toteutuksen teknisiä yksityiskohtia.
    en: The description is generalised and does not cover the technical details of the implementation.
trust_chain:
  name:
    fi: Kela–HSL
    en: Kela–HSL
  note:
    fi: Kaksi luottamuskysymystä, kaksi kerrosta. Kuvaus on yleistetty.
    en: Two trust questions, two layers. The description is generalised.
  links:
    - question:
        fi: 1. Voinko luottaa pyytäjään?
        en: 1. Can I trust the requester?
      answer:
        fi: Lompakko tarkistaa ennen tietojen jakamista, että pyytäjä on HSL. EUDI-lompakossa tämä tapahtuu pääsy- ja rekisteröintivarmenteella, Findynetin verkostossa luottamusrekisteristä.
        en: Before sharing data, the wallet checks that the requester is HSL. In the EUDI Wallet this is done with access and registration certificates, in the Findynet network from the trust registry.
    - question:
        fi: 2. Onko todiste aito?
        en: 2. Is the credential genuine?
      answer:
        fi: HSL tarkistaa todisteen allekirjoituksen ja sen, että allekirjoitusavain kuuluu Kelalle.
        en: HSL checks the credential’s signature and that the signing key belongs to Kela.
    - question:
        fi: 3. Onko myöntäjä valtuutettu tähän?
        en: 3. Is the issuer authorised for this?
      answer:
        fi: Luottamusrekisteri kertoo, että Kela on alennusoikeusekosysteemin valtuutettu myöntäjä ja mitä ekosysteemin sääntöjä se noudattaa.
        en: The trust registry shows that Kela is an authorised issuer in the discount entitlement ecosystem and which ecosystem rules it follows.
    - question:
        fi: 4. Kuka vastaa mistä?
        en: 4. Who is responsible for what?
      answer:
        fi: Ekosysteemin sääntökirja määrittää osapuolten vastuut ja menettelyt virhetilanteissa.
        en: The ecosystem rulebook defines the parties’ responsibilities and procedures in error situations.
flows:
