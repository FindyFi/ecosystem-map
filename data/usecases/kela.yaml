    en: Kela–HSL discount entitlement
  intro:
    fi: "Arvo syntyy säästöinä ja parempana palveluna, ei maksuina Kelan ja HSL:n välillä. Molemmat hyötyvät manuaalityön vähenemisestä: Kelan ei tarvitse laatia todistuskirjeitä eikä HSL:n tarkistaa niitä käsin. Kela ja HSL hankkivat ohjelmistonsa toisistaan riippumatta."
    en: "Value arises as savings and better service, not as payments between Kela and HSL. Both benefit from less manual work: Kela does not need to draft certificate letters and HSL does not need to check them by hand. Kela and HSL procure their software independently of each other."
