    wrprek:
      fi: "Jos EUDI-lompakko: HSL rekisteröityy"
      en: "If the EUDI Wallet is used: HSL registers"
  cast_order:
    - lahde
    - myontaja
    - haltija
    - lompakko
    - todentaja
    - ohjelmisto
    - luottekos
    - rekisteri
    - eudilompakko
