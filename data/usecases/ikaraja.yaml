      to: toimittaja
      type: raha
      model: C
      status: havainnollistava
      name:
        fi: Todennusratkaisun hankinta
        en: Procuring the verification solution
      description:
        fi: Palvelu voi käyttää avointa toteutusta itse tai hankkia todennuksen toimittajalta.
        en: The service can use the open implementation itself or procure verification from a provider.
    - from: palvelu
      to: palvelu
      type: reuna
      status: voimassa
      pill_position: below
      name:
        fi: Alaikäisten suojelu
        en: Protection of minors
      pill:
        fi: "Velvoite: DSA 28 art."
        en: "Obligation: DSA Art. 28"
      description:
        fi: Alaikäisten saatavilla olevien verkkoalustojen on varmistettava alaikäisten yksityisyyden, turvallisuuden ja suojan korkea taso.
        en: Online platforms accessible to minors must ensure a high level of privacy, safety and security of minors.
    - from: kayttaja
      to: lompakko
      type: reuna
      status: voimassa
      name:
        fi: Lompakko maksuton käyttäjälle
        en: Wallet free of charge for the user
      description:
        fi: EUDI-lompakko on luonnollisille henkilöille maksuton. Havainnoimattomuusvaatimus rajoittaa käyttökertoihin perustuvaa laskutusta.
        en: The EUDI Wallet is free of charge for natural persons. The unobservability requirement limits charging based on the number of uses.
  extra:
    title:
      fi: Mitä tästä voi oppia
      en: What can be learned
    text:
      fi: Ikätodiste on hyvä esimerkki valikoivasta jakamisesta. Todentaja tarvitsee vain yhden kyllä/ei-tiedon, ja todiste antaa sen luotettavammin ja halvemmin kuin asiakirjakopio. Kun EU ylläpitää myöntäjien luetteloa ja malliratkaisua, yksittäisen palvelun kynnys ottaa todiste käyttöön on matala.
      en: The age credential is a good example of selective disclosure. The verifier needs only a single yes/no answer, and the credential gives it more reliably and more cheaply than a document copy. When the EU maintains the list of issuers and the blueprint, the threshold for a single service to adopt the credential is low.
