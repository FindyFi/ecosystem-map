# Käyttötapaus. Kaikki näkymät (kuvaus, roolit kartalla, rahavirrat, luottamusketju) rakentuvat tästä tiedostosta.
id: hankinta
name:
  fi: Julkiset hankinnat
  en: Public procurement
short:
  fi: Tarjoaja esittää perustiedot, viranomaistodistukset, sertifikaatit ja luottoluokituksen tarjouskilpailussa yrityslompakolla.
  en: The tenderer presents basic data, authority certificates, quality certificates and a credit rating in a tender with the business wallet.
wallets:
  - ebw
driver: mahdollistava
status: ehdotus
detail:
  title:
    fi: Julkiset hankinnat
    en: Public procurement
  highlight_label:
    fi: Julkiset hankinnat
    en: Public procurement
  lead:
    fi: Tarjoajayritys todistaa soveltuvuutensa ja poissulkemisperusteiden puuttumisen yrityslompakon todisteilla.
    en: A tendering company proves its suitability and the absence of exclusion grounds with credentials in its business wallet.
  status: ehdotus
  intro:
    - fi: Julkisiin hankintoihin käytetään EU:ssa vuosittain noin 2 000 miljardia euroa, noin 13,6 % BKT:stä. Tarjoajien on todistettava hankinnoissa toistuvasti oikeudellinen asemansa, edustusoikeutensa, verojen ja maksujen hoitaminen, taloudellinen tilanteensa sekä laatu-, ympäristö- ja tietoturvasertifikaattinsa. Usein tämä tapahtuu lataamalla liitteitä tai toimittamalla paperisia todistuksia, ja rajat ylittävissä kilpailuissa jopa oikeaksi todistettuja kopioita. Pk-yritysten osallistumis- ja voittoasteet ovat suuria yrityksiä selvästi pienempiä.
      en: Around €2 trillion is spent on public procurement in the EU every year, about 13.6% of GDP. Tenderers repeatedly have to prove their legal status, power of representation, payment of taxes and contributions, financial standing, and quality, environmental and information security certificates. This is often done by uploading attachments or submitting paper certificates, and in cross-border tenders even certified copies. SMEs’ participation and success rates are clearly lower than those of large companies.
    - fi: "Yrityslompakko kokoaa todisteet yhteen: yritys hakee ne kerran ja käyttää niitä moneen kilpailuun, ja hankintayksikkö voi tarkistaa niiden aitouden automaattisesti."
      en: "The business wallet brings the credentials together: the company obtains them once and uses them in many tenders, and the contracting authority can check their authenticity automatically."
