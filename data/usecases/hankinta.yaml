    julkis:
      fi: Hankintayksikkö
      en: Contracting authority
    ebwlo:
      fi: Hankintayksikkö
      en: Contracting authority
    todentaja:
      fi: Hankintayksikkö
      en: Contracting authority
    qerds:
      fi: Tarjouksen jättäminen ja päätöksen tiedoksianto
      en: Submitting the tender and notifying the decision
    hakemisto:
      fi: Yrityksen digitaalinen osoite
      en: The company’s digital address
    akkreditointi:
      fi: Akkreditoi sertifiointilaitokset
      en: Accredits certification bodies
    rekisteri:
      fi: Akkreditoitujen laitosten tiedot
