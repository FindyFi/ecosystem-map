  steps:
    - fi: Hankintayksikkö julkaisee hankintailmoituksen ja kertoo, millä todisteilla soveltuvuus ja poissulkemisperusteiden puuttuminen osoitetaan.
      en: The contracting authority publishes a contract notice and states with which credentials suitability and the absence of exclusion grounds are demonstrated.
    - fi: Tarjoajayrityksen yrityslompakossa on jo omistajan tunnistetiedot (nimi ja EUID). Yritys hakee lompakkoonsa tarvittavat viranomaistodistukset, sertifikaatit ja luottoluokituksen, ellei niitä ole jo siellä.
      en: The tendering company’s business wallet already holds the owner identification data (name and EUID). The company obtains the necessary authority certificates, quality certificates and credit rating for its wallet, unless they are already there.
    - fi: Valtuutettu edustaja laatii tarjouksen. Lompakko näyttää, kuka todisteita pyytää ja mitä, ja edustaja liittää ne tarjoukseen.
      en: An authorised representative prepares the tender. The wallet shows who is requesting credentials and which ones, and the representative attaches them to the tender.
    - fi: Tarjous sinetöidään tai allekirjoitetaan ja jätetään viestintäkanavan tai hankintajärjestelmän kautta.
      en: The tender is sealed or signed and submitted through the communication channel or the procurement system.
    - fi: Hankintayksikkö tarkistaa todisteiden aitouden ja voimassaolon sekä sen, että myöntäjät ovat valtuutettuja. Esimerkiksi sertifiointilaitoksen akkreditointi voidaan tarkistaa luottamusrekisteristä.
      en: The contracting authority checks the authenticity and validity of the credentials and that the issuers are authorised. For example, a certification body’s accreditation can be checked from the trust registry.
    - fi: Hankintapäätös annetaan tiedoksi yrityksen digitaaliseen osoitteeseen. Sopimuskaudella hankintayksikkö voi yrityksen valtuutuksella hakea päivitetyt todisteet automaattisesti.
      en: The award decision is notified to the company’s digital address. During the contract period, the contracting authority can retrieve updated credentials automatically with the company’s authorisation.
  value:
    - who:
        fi: Tarjoaja
        en: Tenderer
      text:
        fi: Samat todisteet käyvät moneen kilpailuun, tiedot ovat ajantasaisia, ja rajat ylittävä tarjoaminen onnistuu ilman oikeaksi todistettuja kopioita.
        en: The same credentials can be used in many tenders, the data is up to date, and cross-border tendering works without certified copies.
    - who:
        fi: Hankintayksikkö
        en: Contracting authority
      text:
        fi: Liitteiden käsin tarkistaminen vähenee, väärennösten riski pienenee, ja todisteiden voimassaoloa voi seurata sopimuskaudella.
        en: Less manual checking of attachments, lower risk of forgery, and the validity of credentials can be monitored during the contract period.
    - who:
        fi: Myöntäjät
        en: Issuers
      text:
        fi: Viranomaisten todistuspyyntöjen käsittely automatisoituu. Sertifiointilaitosten sertifikaattien aitous on helppo varmistaa.
        en: Handling of authorities’ certificate requests is automated. The authenticity of certification bodies’ certificates is easy to verify.
    - who:
        fi: Yhteiskunta
        en: Society
      text:
        fi: Hankinnan ratkaisemiseen kuluu keskimäärin 96 päivää. Vaikutustenarvion mukaan jo prosentin tehostuminen säästäisi noin 20 miljardia euroa vuodessa, ja pk-yritysten osallistuminen voisi lisääntyä.
        en: Awarding a contract takes 96 days on average. According to the impact assessment, a 1% efficiency gain alone would save around €20 billion a year, and SME participation could increase.
  sections:
    - title:
        fi: Sääntely
        en: Regulation
      text:
        fi: Hankintojen menettely perustuu hankintadirektiiviin ja kansalliseen hankintalakiin, jotka määrittävät, millaisia selvityksiä tarjoajalta voidaan vaatia. Yrityslompakkoehdotuksen mukaan julkisyhteisöjen on mahdollistettava asiakirjojen toimittaminen ja tiedoksiannot yrityslompakolla. Tarjoajille lompakon käyttö on vapaaehtoista, joten muut tavat toimittaa selvitykset säilyvät.
        en: Procurement procedures are based on the public procurement directive and national procurement law, which define what evidence can be required from tenderers. Under the business wallet proposal, public sector bodies must enable the submission of documents and notifications with the business wallet. For tenderers, using the wallet is voluntary, so other ways of submitting evidence remain.
    - title:
        fi: Miksi tarvitaan ekosysteemiä
        en: Why an ecosystem is needed
      text:
        fi: "Viranomaisten todisteet saavat luotettavuutensa eIDAS-kehyksestä. Sertifikaatit ja luottoluokitukset ovat kuitenkin ei-hyväksyttyjä todisteita, joita myöntää moni toimija. Hankintayksikön on voitava tarkistaa, onko sertifiointilaitos akkreditoitu ja kuka vastaa todisteen oikeellisuudesta. Luottamusrekisteri ja ekosysteemin sääntökirja täydentävät EUDI- ja yrityslompakkoinfraa juuri tässä: akkreditointielin voi julkaista rekisterissä akkreditoimansa laitokset, jolloin tarkistus automatisoituu."
        en: "Authority credentials derive their reliability from the eIDAS framework. Quality certificates and credit ratings, however, are non-qualified credentials issued by many parties. The contracting authority must be able to check whether a certification body is accredited and who is responsible for the correctness of the credential. This is exactly where the trust registry and the ecosystem rulebook complement the EUDI and business wallet infrastructure: an accreditation body can publish the bodies it has accredited in the registry, so that the check is automated."
  expert:
    fi: "Hankintadirektiivi 2014/24/EU ja hankintalaki määrittävät, millaisia selvityksiä tarjoajalta voidaan vaatia. Yrityslompakko: COM(2025) 838 art. 5(1)(k), 6(1)(d) ja 16; ITRE-mietintöluonnoksen tarkistukset 117–120. Luvut: SWD(2025) 837."
    en: "The public procurement directive 2014/24/EU and national procurement law define what evidence can be required from tenderers. Business wallet: COM(2025) 838 Art. 5(1)(k), 6(1)(d) and 16; ITRE draft report amendments 117–120. Figures: SWD(2025) 837."
  note:
    fi: Kuvaus on yleistetty malli eikä kuvaa yksittäistä toteutusta. Akkreditointitietojen julkaiseminen luottamusrekisterissä on esimerkki mahdollisesta mallista.
    en: The description is a generalised model and does not describe any single implementation. Publishing accreditation data in the trust registry is an example of a possible model.
trust_chain:
  name:
    fi: Julkiset hankinnat
    en: Public procurement
  note:
    fi: Neljä kysymystä, joihin vastaavat eri osat luottamusinfrasta. Akkreditointitietojen julkaiseminen rekisterissä on esimerkki mahdollisesta mallista.
    en: Four questions answered by different parts of the trust infrastructure. Publishing accreditation data in the registry is an example of a possible model.
  links:
    - question:
        fi: 1. Kuka tarjouksen jättää?
        en: 1. Who is submitting the tender?
      answer:
        fi: Hankintayksikkö tarkistaa omistajan tunnistetiedot – virallisen nimen ja EUID:n – sekä sen, että tarjouksen jättäjällä on yrityksen antama mandaatti.
        en: The contracting authority checks the owner identification data – the official name and the EUID – and that the person submitting the tender holds a mandate from the company.
    - question:
        fi: 2. Ovatko viranomaistodistukset aitoja?
        en: 2. Are the authority certificates genuine?
      answer:
        fi: Viranomaistodisteet myöntää autenttisesta lähteestä vastaava viranomainen, jonka tiedot löytyvät eIDAS-luottamuslistoilta.
        en: Authority credentials are issued by the authority responsible for the authentic source, which can be found on the eIDAS trusted lists.
    - question:
        fi: 3. Onko sertifiointilaitos akkreditoitu?
        en: 3. Is the certification body accredited?
      answer:
        fi: "Akkreditointielin voi julkaista luottamusrekisterissä lausuman akkreditoimistaan laitoksista. Hankintayksikkö tarkistaa ketjun automaattisesti: akkreditointielin – sertifiointilaitos – sertifikaatin allekirjoitusavain."
        en: "The accreditation body can publish a statement in the trust registry about the bodies it has accredited. The contracting authority checks the chain automatically: accreditation body – certification body – the certificate’s signing key."
    - question:
        fi: 4. Mihin päätös lähetetään?
        en: 4. Where is the decision sent?
      answer:
        fi: Euroopan digitaalinen hakemisto kertoo yrityksen digitaalisen osoitteen, ja päätös annetaan tiedoksi viestintäkanavan kautta.
        en: The European Digital Directory gives the company’s digital address, and the decision is notified through the communication channel.
