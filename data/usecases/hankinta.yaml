  extra:
    title:
      fi: Mitä tästä voi oppia
      en: What can be learned
    text:
      fi: Viranomaistodisteiden luottamus tulee eIDAS-kehyksestä, mutta sertifikaattien ja luottoluokitusten luotettavuus riippuu siitä, kuka ne myöntää. Kun akkreditoinnit ja valtuutukset ovat koneluettavia, hankintayksikkö voi tarkistaa kaikki todisteet samalla tavalla. Lompakon tarjoajalle julkisyhteisöjen velvoite luo varman kysynnän, mutta tarjoajayritys ottaa lompakon käyttöön vain, jos se säästää vaivaa.
      en: Trust in authority credentials comes from the eIDAS framework, but the reliability of quality certificates and credit ratings depends on who issues them. When accreditations and authorisations are machine-readable, the contracting authority can check all credentials in the same way. For wallet providers, the obligation on public sector bodies creates guaranteed demand, but a tendering company will only adopt the wallet if it saves effort.
