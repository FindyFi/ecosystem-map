      name:
        fi: Apteekkijärjestelmän päivitys
        en: Updating the pharmacy system
      description:
        fi: Apteekkijärjestelmät on päivitettävä hyväksymään EUDI-lompakko. Ohjekirja ei kerro kustannuksia.
        en: Pharmacy systems must be updated to accept the EUDI Wallet. The manual does not give costs.
    - from: myontaja
      to: myontaja
      type: reuna
      status: havainnollistava
      name:
        fi: Terveystunnistetta ei ole määritelty laissa
        en: The Health ID attestation is not defined in law
      pill:
        fi: "Avoin: täytäntöönpanosäädös"
        en: "Open: implementing act"
      description:
        fi: Ohjekirja ehdottaa terveystunnisteelle EHDS-asetuksen täytäntöönpanosäädöstä. Siihen asti tunnisteen myöntäminen riippuu jäsenvaltion omista ratkaisuista.
        en: The manual suggests an implementing act under the EHDS Regulation for the Health ID attestation. Until then, issuing it depends on each Member State’s own decisions.
    - from: apteekki
      to: apteekki
      type: reuna
      status: voimassa
      pill_position: below
      name:
        fi: Liittyminen MyHealth@EU-verkkoon
        en: Connecting to MyHealth@EU
      pill:
        fi: "Velvoite: MyHealth@EU 2029"
        en: "Obligation: MyHealth@EU 2029"
      description:
        fi: EHDS-asetuksen mukaan apteekkien on liityttävä MyHealth@EU-verkkoon, ja sähköisten reseptien yhteentoimivuusvelvoitteet alkavat 26.3.2029. Lompakon hyväksymistä ei velvoiteta.
        en: Under the EHDS Regulation, pharmacies must connect to MyHealth@EU, and the interoperability obligations for ePrescriptions apply from 26 March 2029. Accepting the wallet is not mandated.
    - from: potilas
