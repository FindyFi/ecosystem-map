      type: reuna
      status: voimassa
      name:
        fi: Lompakko maksuton potilaalle
        en: Wallet free of charge for the patient
      description:
        fi: EUDI-lompakko on luonnollisille henkilöille maksuton.
        en: The EUDI Wallet is free of charge for natural persons.
  extra:
    title:
      fi: Mitä tästä voi oppia
      en: What can be learned
    text:
      fi: Lompakon ei tarvitse sisältää kaikkea tietoa. Tässä se kantaa vain tunnisteen, ja arkaluonteinen terveystieto kulkee edelleen terveydenhuollon omassa verkossa. Luottamusinfra on pääosin valmis, mutta käyttöönotto riippuu apteekkijärjestelmien päivityksistä ja siitä, määritelläänkö terveystunniste säädöksessä.
      en: The wallet does not need to contain all the data. Here it carries only an identifier, and sensitive health data still travels in healthcare’s own network. The trust infrastructure is largely in place, but deployment depends on pharmacy system updates and on whether the Health ID attestation is defined in legislation.
