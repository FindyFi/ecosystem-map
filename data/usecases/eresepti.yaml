      en: Trusted lists – PuB-EAA providers
    wrprek:
      fi: Apteekit rekisteröityvät luottaviksi osapuoliksi
      en: Pharmacies register as relying parties
    varmenne:
      fi: Apteekin pääsyvarmenne
      en: The pharmacy’s access certificate
    skeema:
      fi: Terveystunnisteen tietosisältö MyHealth@EU-määrittelyjen mukaan
      en: Health ID data content in line with MyHealth@EU specifications
    luottekos:
      fi: Mahdollinen apteekkien ja terveydenhuollon ekosysteemi
      en: Possible pharmacy and healthcare ecosystem
  cast_order:
    - haltija
    - lahde
    - myontaja
    - pubeaa
    - eudilompakko
    - todentaja
    - ohjelmisto
    - tl
    - wrprek
    - varmenne
    - skeema
    - luottekos
  steps:
    - fi: Potilas saa jäsenvaltion nimeämältä myöntäjältä terveystunnisteen EUDI-lompakkoonsa. Tunnisteessa on muun muassa vakuutusmaa, vakuutus- ja potilastunniste, nimi ja syntymäaika.
      en: The patient receives a Health ID attestation in their EUDI Wallet from an issuer designated by the Member State. It contains, among other things, the country of affiliation, health insurance and patient identifiers, name and date of birth.
    - fi: Lääkäri kirjaa reseptin sähköiseen reseptijärjestelmään, joka on yhteydessä MyHealth@EU-verkkoon.
      en: The physician enters the prescription in the electronic prescription system, which is connected to MyHealth@EU.
    - fi: Potilas menee valitsemaansa apteekkiin, myös toisessa jäsenvaltiossa, ja esittää terveystunnisteen lähietäisyydeltä tai etänä.
      en: The patient goes to a pharmacy of their choice, also in another Member State, and presents the Health ID attestation in proximity or remotely.
    - fi: Lompakko tarkistaa, että pyytäjä on rekisteröity apteekki. Apteekki tarkistaa tunnisteen allekirjoituksen ja sen, että myöntäjä on luotettavalla listalla.
      en: The wallet checks that the requester is a registered pharmacy. The pharmacy checks the attestation’s signature and that the issuer is on the trusted list.
    - fi: Farmaseutti hakee tunnisteen tiedoilla potilaan reseptin MyHealth@EU:n kautta kotimaan järjestelmästä.
      en: Using the attestation data, the pharmacist retrieves the patient’s prescription from the home country’s system through MyHealth@EU.
    - fi: Farmaseutti toimittaa lääkkeen ja palauttaa toimitustiedot järjestelmään. Resepti- ja toimitustiedot eivät tallennu lompakkoon.
      en: The pharmacist dispenses the medication and submits the dispensation data to the system. Prescription and dispensation data are not stored in the wallet.
  value:
    - who:
        fi: Potilas
        en: Patient
      text:
        fi: Lääkkeen saa samalla tavalla kotimaassa ja ulkomailla. Erillistä henkilöllisyystodistusta, sovellusta, tulostetta tai vakuutuskorttia ei tarvita.
        en: Medication can be collected in the same way at home and abroad. No separate identity document, app, printout or insurance card is needed.
    - who:
        fi: Apteekki
        en: Pharmacy
      text:
        fi: Potilaan tunnistaminen nopeutuu, ja tunnistus- ja kirjausvirheet vähenevät sekä kotimaisissa että rajat ylittävissä toimituksissa.
        en: Identifying the patient is faster, and identification and data entry errors decrease in both domestic and cross-border dispensations.
    - who:
        fi: Viranomaiset
        en: Authorities
      text:
        fi: Rajat ylittävä yhteentoimivuus perustuu yhteiseen digitaaliseen identiteettiin, ja hallinnolliset kustannukset pienenevät.
        en: Cross-border interoperability is based on a common digital identity, and administrative costs decrease.
    - who:
        fi: Yhteiskunta
        en: Society
      text:
        fi: Yhtenäinen tunnistustapa noin 200 000 apteekissa tukee EHDS-asetuksen tavoitetta, että sähköiset reseptit toimivat kaikkialla EU:ssa.
        en: A uniform identification method in around 200,000 pharmacies supports the EHDS Regulation’s aim of ePrescriptions working everywhere in the EU.
  sections:
    - title:
        fi: Sääntely
        en: Regulation
      text:
        fi: Rajat ylittävää terveydenhuoltoa koskeva direktiivi velvoittaa tunnustamaan toisessa jäsenvaltiossa annetut reseptit. Eurooppalaisen terveysdataavaruuden (EHDS) asetus velvoittaa jäsenvaltiot ja apteekit liittymään MyHealth@EU-verkkoon, ja sähköisten reseptien yhteentoimivuusvelvoitteet alkavat 26.3.2029. EUDI-lompakon käyttöä resepteissä ei kuitenkaan erikseen velvoiteta, eikä terveystunnistetta ole määritelty lainsäädännössä. Ohjekirja ehdottaa sille EHDS-asetuksen täytäntöönpanosäädöstä.
        en: The cross-border healthcare directive requires prescriptions issued in another Member State to be recognised. The European Health Data Space (EHDS) Regulation requires Member States and pharmacies to connect to MyHealth@EU, and the interoperability obligations for ePrescriptions apply from 26 March 2029. However, using the EUDI Wallet for prescriptions is not specifically mandated, and the Health ID attestation is not defined in legislation. The manual suggests an implementing act under the EHDS Regulation for it.
    - title:
        fi: Miksi tarvitaan ekosysteemiä
        en: Why an ecosystem is needed
      text:
        fi: "Perusluottamus tulee valmiista infrasta: terveystunnisteen myöntäjä voidaan rekisteröidä PuB-EAA-listalle, apteekit rekisteröityvät luottaviksi osapuoliksi, ja MyHealth@EU hoitaa reseptitietojen välityksen. Erillistä luottamusrekisteriä ei tarvita kertomaan, onko myöntäjä luotettava. Ekosysteemiä tarvitaan sen sijaan käyttöönotossa: apteekkijärjestelmien toimittajien, apteekkien ja myöntäjien on sovittava tunnisteen tietosisällöstä, testauksesta ja vastuista. Yhteinen yhteentoimivuusprofiili ja sääntökirja voivat nopeuttaa tätä."
        en: "Basic trust comes from existing infrastructure: the Health ID issuer can be registered on the PuB-EAA list, pharmacies register as relying parties, and MyHealth@EU handles the exchange of prescription data. No separate trust registry is needed to tell whether the issuer is trustworthy. An ecosystem is needed instead for deployment: pharmacy system vendors, pharmacies and issuers must agree on the attestation’s data content, testing and responsibilities. A common interoperability profile and rulebook can speed this up."
  expert:
    fi: "EHDS-asetus (EU) 2025/327 art. 23 (MyHealth@EU-liityntä) ja mahdollinen täytäntöönpanosäädös art. 16 nojalla (tunnistamisen hallinta); direktiivi 2011/24/EU (reseptien vastavuoroinen tunnustaminen). PuB-EAA: asetus 910/2014 sellaisena kuin se on muutettuna asetuksella 2024/1183, art. 3(46) ja 45f. Muoto ISO/IEC 18013-5 (mdoc); esittäminen ISO/IEC 18013-5 ja ISO/IEC TS 18013-7; myöntäminen esim. OpenID4VCI 1.0. Kehittänyt suurpilotti POTENTIAL."
    en: "EHDS Regulation (EU) 2025/327 Art. 23 (connecting to MyHealth@EU) and a possible implementing act under Art. 16 (identification management); Directive 2011/24/EU (mutual recognition of prescriptions). PuB-EAA: Regulation 910/2014 as amended by Regulation 2024/1183, Art. 3(46) and 45f. Format ISO/IEC 18013-5 (mdoc); presentation ISO/IEC 18013-5 and ISO/IEC TS 18013-7; issuance e.g. OpenID4VCI 1.0. Developed by the large-scale pilot POTENTIAL."
  note:
    fi: Kuvaus perustuu komission käyttötapausohjekirjaan ja on yleistetty malli eikä kuvaa yksittäistä toteutusta. MyHealth@EU-määrittelyjä ja apteekkijärjestelmiä voidaan joutua päivittämään ennen käyttöönottoa.
    en: The description is based on the Commission’s use case manual and is a generalised model that does not describe any single implementation. MyHealth@EU specifications and pharmacy systems may need updating before deployment.
trust_chain:
  name:
    fi: Sähköinen resepti
    en: ePrescription
  note:
    fi: Neljä kysymystä, joihin vastaavat EUDI-luottamusinfra ja MyHealth@EU. Kuvaus on yleistetty.
    en: Four questions answered by the EUDI trust infrastructure and MyHealth@EU. The description is generalised.
  links:
    - question:
        fi: 1. Voinko luottaa pyytäjään?
        en: 1. Can I trust the requester?
      answer:
        fi: Lompakko tarkistaa apteekin pääsyvarmenteen ja rekisteröinnin ennen kuin se näyttää potilaalle, mitä tietoja pyydetään.
        en: The wallet checks the pharmacy’s access certificate and registration before showing the patient which data is requested.
    - question:
        fi: 2. Onko terveystunniste aito?
        en: 2. Is the Health ID attestation genuine?
      answer:
        fi: Apteekki tarkistaa tunnisteen allekirjoituksen ja sen, että myöntäjä on PuB-EAA-tarjoajien luotettavalla listalla.
        en: The pharmacy checks the attestation’s signature and that the issuer is on the trusted list of PuB-EAA providers.
    - question:
        fi: 3. Onko resepti aito ja voimassa?
        en: 3. Is the prescription genuine and valid?
      answer:
        fi: Resepti ei kulje lompakossa. Apteekki hakee sen MyHealth@EU:n kautta suoraan potilaan kotimaan järjestelmästä.
        en: The prescription does not travel in the wallet. The pharmacy retrieves it through MyHealth@EU directly from the patient’s home country system.
    - question:
        fi: 4. Kuka vastaa mistä?
        en: 4. Who is responsible for what?
      answer:
        fi: EHDS-asetus ja MyHealth@EU:n säännöt määrittävät tietojen välityksen vastuut. Tunnisteen tietosisällöstä ja apteekkien käyttöönotosta voidaan sopia ekosysteemin sääntökirjassa.
        en: The EHDS Regulation and the MyHealth@EU rules define responsibilities for exchanging data. The attestation’s data content and pharmacies’ deployment can be agreed in an ecosystem rulebook.
