    haltija:
      fi: Potilas
      en: Patient
    lahde:
      fi: Kotimaan kansallinen terveystietojärjestelmä ja reseptitiedot
      en: The home country’s national digital health system and prescription data
    myontaja:
      fi: Jäsenvaltion nimeämä terveystunnisteen myöntäjä
      en: Health ID issuer designated by the Member State
    pubeaa:
      fi: Terveystunnisteen myöntäjä, joka voidaan rekisteröidä PuB-EAA-listalle
