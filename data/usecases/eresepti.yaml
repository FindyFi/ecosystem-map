# Käyttötapaus. Kaikki näkymät (kuvaus, roolit kartalla, rahavirrat, luottamusketju) rakentuvat tästä tiedostosta.
id: eresepti
name:
  fi: Sähköinen resepti apteekissa ulkomailla
  en: ePrescription at a pharmacy abroad
short:
  fi: Potilas tunnistautuu apteekissa EUDI-lompakon terveystunnisteella, ja apteekki hakee reseptin MyHealth@EU-verkon kautta.
  en: The patient identifies at the pharmacy with a Health ID attestation in the EUDI Wallet, and the pharmacy retrieves the prescription through MyHealth@EU.
wallets:
  - eudi
driver: mahdollistava
status: kaytanto
detail:
  title:
    fi: Sähköinen resepti apteekissa ulkomailla
    en: ePrescription at a pharmacy abroad
  highlight_label:
    fi: Sähköinen resepti
    en: ePrescription
  lead:
    fi: Potilas hakee lääkkeensä mistä tahansa apteekista, myös toisessa jäsenvaltiossa, esittämällä EUDI-lompakon terveystunnisteen.
    en: The patient collects their medication from any pharmacy, including in another Member State, by presenting a Health ID attestation in the EUDI Wallet.
  status: kaytanto
  intro:
    - fi: EU:ssa toimi vuonna 2024 noin 200 000 apteekkia, ja lääketoimituksia arvioidaan olevan noin 6,7 miljardia vuodessa. Rajat ylittävä sähköinen resepti toimii jo MyHealth@EU-verkossa, jota on käytetty vuodesta 2019. Apteekissa potilaan tunnistaminen vaihtelee kuitenkin maittain, ja usein tarvitaan erillinen henkilöllisyystodistus, sovellus, tuloste tai vakuutuskortti.
      en: Around 200,000 pharmacies operated in the EU in 2024, and there are an estimated 6.7 billion medication dispensations a year. Cross-border ePrescriptions already work in the MyHealth@EU network, which has been in use since 2019. At the pharmacy, however, patient identification varies by country, and a separate identity document, app, printout or insurance card is often needed.
    - fi: "Lompakko ei sisällä reseptiä. Siinä on terveystunniste (Health ID), joka kertoo, kuka potilas on ja mistä maasta ja vakuutuksesta hänen tietonsa löytyvät. Resepti haetaan ja toimitustieto palautetaan kansalliseen terveystietojärjestelmään MyHealth@EU:n kautta. Sama tunniste käy kaikkiin resepteihin koko voimassaoloaikansa."
      en: "The wallet does not contain the prescription. It holds a Health ID attestation that tells who the patient is and in which country and insurance their data can be found. The prescription is retrieved from, and the dispensation data returned to, the national digital health system through MyHealth@EU. The same attestation works for all prescriptions throughout its validity."
