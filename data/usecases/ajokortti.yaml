  extra:
    title:
      fi: Mitä tästä voi oppia
      en: What can be learned
    text:
      fi: Kun todisteella on oma alakohtainen säädös ja vakiintunut kansainvälinen standardi, EU:n luottamusinfra riittää, eikä erillistä luottamusrekisteriä tarvita. Mobiiliajokortti on myös hyvä esimerkki lähitunnistuksesta, joka toimii ilman verkkoyhteyttä. Ekosysteemin sääntökirjalle jää tilaa toimialan omissa todisteissa, kuten vuokraamon varausvahvistuksessa.
      en: When a credential has its own sector-specific legislation and an established international standard, the EU trust infrastructure is enough, and no separate trust registry is needed. The mobile driving licence is also a good example of proximity verification that works without a network connection. An ecosystem rulebook still has a role in the sector’s own credentials, such as the rental company’s booking confirmation.
