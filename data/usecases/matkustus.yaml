        fi: "Hyöty: lyhyempi tarkastus"
        en: "Benefit: shorter check"
      description:
        fi: Kun tiedot on tarkistettu etukäteen, rajalla jää tehtäväksi vain lopullinen tarkastus.
        en: When the data has been checked in advance, only the final check remains at the border.
