      name:
        fi: Myöntämisen rahoitus
        en: Funding issuance
      description:
        fi: Jäsenvaltio rahoittaa DTC:n myöntämisen osana passi- ja henkilökorttijärjestelmäänsä. Ehdotukset eivät määrää maksuja.
        en: The Member State funds the issuance of the DTC as part of its passport and identity card system. The proposals do not set fees.
    - from: eu
      to: raja
      type: raha
      model: E
      status: havainnollistava
      bend: 60
      name:
        fi: Rajatarkastuksen järjestelmät
        en: Border check systems
      description:
        fi: Rajaviranomaisten on päivitettävä järjestelmänsä vastaanottamaan DTC:itä.
        en: Border authorities must update their systems to receive DTCs.
    - from: eu
      to: lompakko
      type: raha
      model: E
      status: havainnollistava
      bend: -230
      name:
        fi: EUDI-lompakon rahoitus
        en: Funding the EUDI Wallet
      description:
        fi: Jäsenvaltio tarjoaa EUDI-lompakon tai rahoittaa sen.
        en: The Member State provides or funds the EUDI Wallet.
