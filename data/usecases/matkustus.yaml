      to: lompakko
      type: reuna
      status: voimassa
      name:
        fi: Lompakko maksuton haltijalle
        en: Wallet free of charge for the holder
      description:
        fi: EUDI-lompakko on luonnollisille henkilöille maksuton.
        en: The EUDI Wallet is free of charge for natural persons.
    - from: raja
      to: matkustaja
      type: reuna
      status: ehdotus
      bend: 40
      name:
        fi: Matkustajalle vapaaehtoinen
        en: Voluntary for the traveller
      description:
        fi: Matkustaja voi käyttää fyysistä tai digitaalista asiakirjaa. Jäsenvaltioiden on hyväksyttävä DTC, kun lainsäädäntö ja yhteinen ratkaisu ovat valmiit.
        en: The traveller can use the physical or the digital document. Member States must accept the DTC once the legislation and the common solution are ready.
  extra:
    title:
      fi: Mitä tästä voi oppia
      en: What can be learned
    text:
      fi: Kaikki todisteet eivät tarvitse uutta luottamusinfraa. DTC:n luotettavuus perustuu samaan ICAO-varmenneinfraan kuin passin siru, ja lompakko tuo siihen vain uuden esitystavan. Arvo syntyy siitä, että tarkastus siirtyy ajallisesti aikaisemmaksi, ei uusista rahavirroista. Toimialan ekosysteemiä tarvitaan vasta, jos matkustusasiakirjasta johdettuja tietoja halutaan käyttää yksityisissä palveluissa.
      en: Not all credentials need new trust infrastructure. The reliability of the DTC is based on the same ICAO certificate infrastructure as the passport chip, and the wallet only adds a new way of presenting it. Value arises from moving the check earlier in time, not from new money flows. A sector ecosystem is needed only if data derived from the travel document is to be used in private services.
