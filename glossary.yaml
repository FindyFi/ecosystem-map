# Sanasto – Glossary
# Käytä näitä termejä johdonmukaisesti molemmilla kielillä. Englanninkieliset termit noudattavat
# asetusten virallisia englanninkielisiä versioita. Suomenkieliset termit noudattavat asetusten
# suomenkielisiä versioita, ja yleiskielinen vastine on mainittu, jos visualisoinnissa käytetään sitä.
# Viralliset suomenkieliset termit on syytä tarkistaa EUR-Lexin suomenkielisistä säädösteksteistä.
# Tätä tiedostoa ei käytetä buildissa; se on sisällöntuottajien ja kääntäjien apuväline.
- en: electronic attestation of attributes (EAA)
  fi: sähköinen attribuuttitodistus
  plain_fi: todiste
  source: eIDAS art. 3(44)
- en: qualified electronic attestation of attributes (QEAA)
  fi: hyväksytty sähköinen attribuuttitodistus
  plain_fi: hyväksytty todiste
  source: eIDAS art. 3(45)
- en: electronic attestation of attributes issued by or on behalf of a public sector body responsible for an authentic source (PuB-EAA)
  fi: autenttisesta lähteestä vastaavan julkisen sektorin elimen myöntämä sähköinen attribuuttitodistus
  plain_fi: PuB-EAA-todiste
  source: eIDAS art. 3(46)
- en: authentic source
  fi: autenttinen lähde
  source: eIDAS art. 3(47)
- en: person identification data (PID)
  fi: henkilön tunnistetiedot
  source: eIDAS art. 3(3)
- en: European Digital Identity Wallet (EUDI Wallet)
  fi: eurooppalainen digitaalisen identiteetin lompakko
  plain_fi: EUDI-lompakko
  source: eIDAS art. 3(42)
- en: wallet-relying party
  fi: lompakkoon luottava osapuoli
  plain_fi: luottava osapuoli, todentaja
  source: eIDAS art. 5b
- en: verifier
  fi: todentaja
  note: Yleinen termi; eIDAS käyttää termiä luottava osapuoli.
- en: holder
  fi: haltija
- en: issuer
  fi: myöntäjä
- en: intermediary
  fi: välittäjä
  source: eIDAS art. 5b(10)
- en: unobservability
  fi: havainnoimattomuus
- en: trusted list
  fi: luotettu luettelo
  plain_fi: luotettava lista
  source: eIDAS art. 22
- en: List of Trusted Entities (LoTE)
  fi: luotettavien toimijoiden lista (LoTE)
  source: ETSI TS 119 602, ARF 3.0.0
- en: qualified trust service provider (QTSP)
  fi: hyväksytty luottamuspalvelun tarjoaja
- en: qualified electronic registered delivery service (QERDS)
  fi: hyväksytty sähköinen rekisteröity jakelupalvelu
  plain_fi: viestintäkanava
- en: European Business Wallet
  fi: eurooppalainen yrityslompakko
  plain_fi: yrityslompakko
  source: COM(2025) 838
- en: European Business Wallet owner
  fi: yrityslompakon omistaja
  source: COM(2025) 838 art. 3
- en: European Business Wallet owner identification data
  fi: yrityslompakon omistajan tunnistetiedot
  source: COM(2025) 838 art. 8
- en: European Digital Directory
  fi: Euroopan digitaalinen hakemisto
  source: COM(2025) 838 art. 10
- en: European Unique Identifier (EUID)
  fi: eurooppalainen yksilöivä tunniste (EUID)
  source: Directive 2017/1132
- en: certification scheme owner
  fi: sertifiointijärjestelmän omistaja
  source: 2024/2981 art. 2
- en: conformity assessment body
  fi: vaatimustenmukaisuuden arviointilaitos
- en: contracting authority
  fi: hankintayksikkö
  source: Directive 2014/24/EU
- en: trust registry
  fi: luottamusrekisteri
- en: rulebook
  fi: sääntökirja
- en: trust ecosystem
  fi: luottamusekosysteemi
- en: interoperability profile
  fi: yhteentoimivuusprofiili
- en: participation fee
  fi: osallistumismaksu
# Suomalaiset toimijat englanninkielisessä tekstissä: mainitse ensimmäisellä kerralla selite.
- en: Kela, the Social Insurance Institution of Finland
  fi: Kela
- en: Helsinki Region Transport (HSL)
  fi: HSL
- en: Finnish Transport and Communications Agency Traficom
  fi: Liikenne- ja viestintävirasto Traficom
- en: Digital and Population Data Services Agency (DVV)
  fi: Digi- ja väestötietovirasto (DVV)
- en: Finnish Patent and Registration Office (PRH)
  fi: Patentti- ja rekisterihallitus (PRH)
- en: FINAS (Finnish Accreditation Service)
  fi: FINAS-akkreditointipalvelu
